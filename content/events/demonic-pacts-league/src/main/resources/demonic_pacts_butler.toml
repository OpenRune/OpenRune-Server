# Butler's Bell jobs, from the relic's description: ores 8, fish 14, logs 10 and flax 50 a
# minute; processed jobs run at half that and give 10 XP each in the production skill
# (`xp_stat`). Raw gathering gives no XP. `stat`/`level` is the level you need to set the job.
# The butler keeps working while you are logged out and holds at most `max_items`.

max_items = 2000

[[job]]
name = "Chop logs"
item = "obj.logs"
stat = "stat.woodcutting"
level = 1
per_minute = 10

