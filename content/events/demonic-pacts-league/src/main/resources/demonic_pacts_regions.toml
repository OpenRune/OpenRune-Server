# Region areas for the league lock, as boxes of [minX, minZ, maxX, maxZ] (inclusive).
#
# These are hand-drawn approximations of the league region map, not Jagex's data. Tiles that match
# no region are always allowed, so a gap never traps anyone. Use ::dpregion in game to see which
# region you are standing in, and widen or add boxes here if something is wrong.
#
# `raw_boxes` are matched against exact coordinates and checked first, for dungeons and other areas
# that sit away from the surface map. `boxes` are matched against surface coordinates, with
# underground tiles (z >= 6400) folded up onto the surface above them.
#
# `bit` is the save slot for the region. Never renumber an existing region.

[[region]]
key = "always"
name = "Shared areas"
bit = -1
raw_boxes = [
    [2370, 4410, 2500, 4480], # Zanaris
    [3010, 4800, 3070, 4860], # Abyss
    [3030, 4820, 3060, 4850], # Abyssal area
]

