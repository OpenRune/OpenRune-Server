start_z = 3134
start_level = 0

# League point thresholds for relic tiers 1-8.
tier_thresholds = [0, 600, 1200, 2600, 5200, 8500, 16500, 28000]

# League points per task difficulty.
easy_points = 10
medium_points = 30
hard_points = 80
