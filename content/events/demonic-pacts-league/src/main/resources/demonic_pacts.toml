# Demonic Pacts League settings. Restart the server after editing.

# Where a new league character starts. Civitas illa Fortis, Varlamore.
start_x = 1760
start_z = 3112
start_level = 0

# Map squares ("x_z", as ::mypos prints them) the client cannot load from this cache: standing
# within view of one freezes the game. League players who log in near one are moved to the start.
broken_map_squares = ["25_48"]

# League point thresholds for relic tiers 1-8.
tier_thresholds = [0, 600, 1200, 2600, 5200, 8500, 16500, 28000]

# League points per task difficulty.
easy_points = 10
medium_points = 30
hard_points = 80
elite_points = 200
master_points = 400

# Pact points: two from the tutorial, 44 earnable in total, at most 40 spent at once.
starting_pact_points = 2
max_pact_points_earned = 44
max_pacts_spent = 40
starting_pact_resets = 6

# The official league has far more pact tasks than the starter task list here, so every N completed
# tasks also award a pact point. Set to 0 to turn this off.
bonus_pact_point_every_tasks = 10

# Tasks needed for Karamja and for each of the three chosen regions.
karamja_tasks = 80
region_task_thresholds = [200, 300, 450]

# Set false to let league players walk anywhere.
region_lock = true

# Port for this world's jav_config.ws and world_list.ws, which mark it as a league world so the
# client shows its league interfaces. Point RSProx at http://127.0.0.1:<port>/jav_config.ws.
web_port = 8081
