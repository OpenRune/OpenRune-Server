# League tasks. A starter set, not the full official list: add your own freely.
#
# type = "kill"         npc (display name, case-insensitive), killed once
# type = "kills"        value = total monsters killed in the league
# type = "level"        stat + value
# type = "total_level"  value
# type = "combat_level" value
# type = "pacts_owned"  value = pacts held at the same time
#
# tier: easy, medium, hard, elite, master. region: a region key from demonic_pacts_regions.toml,
# or "general". pact = true also awards a pact point.
#
# `bit` is the save slot for the task (0-255). Never renumber an existing task.

