[[enum]]
isServerOnly = true
id = "enum.trail_uri_phrases"
keyType = "INT"
valueType = "STRING"

[enum.values]
0 = "A great captain is always ready to change course."
1 = "Actions have consequences."
2 = "Can I have your teabag?"
3 = "Can you stand me?"
4 = "Have you found the key to the secret room?"
5 = "I am the egg man, are you one of the egg men?"
6 = "I believe that it is very rainy in Varrock."
7 = "I have a story about that."
8 = "I heard that the tall man fears only strong winds."
9 = "I quite fancy an onion."
10 = "In Canifis the men are known for eating much spam."
11 = "In the end, only the three-legged will survive."
12 = "It is possible to commit no mistakes and still lose."
13 = "Loser says what."
14 = "My magic carpet is full of eels."
15 = "Once, I was a poor man, but then I found a party hat."
16 = "Quickly! I've got a bee sticking out of my arm!"
17 = "The slowest of fishermen catch the swiftest of fish."
18 = "*sneezes* What?"
19 = "The sudden appearance of a deaf squirrel is most puzzling, comrade."
20 = "There were three goblins in a bar, which one left first?"
21 = "Up in the north, I hear they keep milk in bags rather than buckets."
22 = "Want to see me bend a spoon?"
23 = "What's cheese?"
24 = "Would you like to buy a pewter spoon?"

