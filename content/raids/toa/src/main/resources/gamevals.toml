# Custom server-only varps for TOA. -1 = auto-assign: buildCache picks a free id
# and writes it back into this file. Commit the file after that first build.
[gamevals.varp]
toa_personal_invocations_a = 65478
toa_personal_invocations_b = 65477
toa_personal_invocations_c = 65476
toa_personal_kc_requirement = 65475

# TOA lobby area (polygon in .data/raw-cache/map/area/toa_lobby.toml).
# Explicit id, like the other area modules (rune_essence_mine 57, motherlode_mine 59).
[gamevals.area]
toa_lobby = 60
# The raid's rooms (polygon in .data/raw-cache/map/area/toa_raid.toml). Leaving it by any
# means other than our own exits (a teleport spell, a tablet) leaves the raid.
toa_raid = 61

# Our own death queue: a TOA death is swapped onto this before queue.death can run (see
# ToaDeathScript). Explicit id; custom queues elsewhere use 40-60 and 65524-65535.
[gamevals.queue]
toa_death = 61

# Names for Zebak's synths. The cache leaves them unnamed (synth_5823 etc.); these are the labels
# from its sound-list dbtable synth_zabakboss (osrs-dumps config/dump.dbrow), the same way
# .data/gamevals/synth.rscm and generic-locs name vanilla synths. Use them as "synth.<name>".
[gamevals.synth]
toa_zebak_red_projectile_04 = 5823
toa_zebak_whoosh_projectile_02 = 5819
toa_zebak_redirected_jug_break_01 = 5878
toa_zebak_redirected_projectile_02 = 5896
toa_zebak_projectile_impact_01 = 5884
toa_zebak_defend_01 = 6590
# Offline_Scape FINAL_PHASE_SOUND. Label from dbtable (not a Zebak row): FI_trollking_roar.
fi_trollking_roar = 3405

# Server-only projectile types (timings in pack/.../configs/toa_zebak.toml). Explicit ids from the
# top of the range, like other modules' custom ids; .data/gamevals/projanim.rscm uses 0-17.
[gamevals.projanim]
toa_zebak_initial = 65535
toa_zebak_split = 65534
toa_zebak_poison_spread = 65533
