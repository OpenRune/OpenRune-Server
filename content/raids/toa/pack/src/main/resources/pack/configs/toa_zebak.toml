# Zebak (Crondis boss room). Server-side npc behaviour and projectile timings, packed into the
# server cache with the rest of .data/raw-cache/server by buildCache (PackServerConfig scans every
# plugin pack's configs directory the same way).
#
# All of Zebak's npcs are driven by ZebakEncounter, so none of them wander, hunt or regenerate:
#   defaultMode = "None"   no wandering/hunting of its own (was npc.noneMode() in code)
#   regenRate = 0          NpcRegenProcessor skips regeneration (ToA npcs don't heal over time)
#   moveRestrict = "NoMove" can never move (was npc.movementLocked in code)
#   respawnDir             the direction it faces when spawned (was npc.respawnDir in code)

# ---- Zebak (and the npcs he's transmogged into) ----

[[npc]]
id = "npc.toa_zebak"
inherit = "npc.toa_zebak"
defaultMode = "None"
moveRestrict = "NoMove"
respawnDir = "East"
regenRate = 0

# At 25% Zebak is transmogged into this one (OSRS Wiki: the enraged form).
