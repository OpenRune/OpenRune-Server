# Personal TOA settings: the invocations and completion requirement a player's
# next party starts with. Server-only (the real game never sends these to the
# client), saved with the character.

[[varp]]
isServerOnly = true
id = "varp.toa_personal_invocations_a"
scope = "Perm"
transmit = "Never"

[[varp]]
isServerOnly = true
id = "varp.toa_personal_invocations_b"
scope = "Perm"
transmit = "Never"

[[varp]]
isServerOnly = true
id = "varp.toa_personal_invocations_c"
scope = "Perm"
transmit = "Never"

[[varp]]
isServerOnly = true
id = "varp.toa_personal_kc_requirement"
scope = "Perm"
transmit = "Never"

# The lobby's item retrieval chest (ToaRetrieval). The cache's gravestone inv, the one interface
# 602 shows, made persistent like the bank and tackle box in .data/raw-cache/server/inv.toml.
# protect = false: items are stored from inside the raid's protected access (a failed raid).
[[inventory]]
isServerOnly = true
id = "inv.gravestone"
inherit = "inv.gravestone"
scope = "Perm"
protect = false

# Whether the retrieval chest still needs its fee paid.
[[varp]]
isServerOnly = true
id = "varp.toa_retrieval_locked"
scope = "Perm"
transmit = "Never"
