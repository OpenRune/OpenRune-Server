# Below Ice Mountain NPC placement and wander overrides.
#
# Facing values come from the spawnangle fields in the packet log. NPCs that
# only ever show idle/say in the log are pinned with NoMove so they cannot
# drift from their OSRS position. The wandering NPCs keep a small wander range
# measured from their observed packet-log paths.

[[npc]]
id = "npc.bim_willow_outside"
inherit = "npc.bim_willow_outside"
moveRestrict = "NoMove"
defaultMode = "None"
wanderRange = 0
respawnDir = "East"

