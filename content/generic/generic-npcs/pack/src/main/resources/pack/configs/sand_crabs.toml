# Server-only on purpose. The awake types' original entries stay in .data/raw-cache/server/npcs.toml:
# the incremental cache build treats a config entry moving between files as a removal and then
# inherits from the definition it just deleted, which leaves the cache with an empty npc. These
# entries override those for the server (a later file wins), so they repeat the weakness params.
[[npc]]
isServerOnly = true
id = "npc.zeah_sandcrab_inactive"
inherit = "npc.zeah_sandcrab_inactive"
defaultMode = "None"
wanderRange = 0
huntRange = 5
respawnRate = 50
timer = 1
[npc.params]
"param.attack_anim" = "seq.horror_crab_attack"
"param.defend_anim" = "seq.horror_crab_defend"
"param.death_anim" = "seq.horror_crab_hide"
"param.npc_attack_type" = "category.attacktype_crush"
"param.cannon_immunity" = 1
"param.elemental_weakness_type" = 2
"param.elemental_weakness_percent" = 20

