name: OpenWiki Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "openwiki/**"
      - ".github/workflows/openwiki-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install OpenWiki
        run: npm install --global openwiki@0.7.0

      - name: Export visualizer
        run: openwiki visualize . --export _site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload visualizer
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
