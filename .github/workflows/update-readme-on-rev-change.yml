name: Sync Revision with README

permissions:
  contents: write

on:
  push:
    branches:
      - main
    paths:
      - "game.example.yml"
      - ".github/workflows/publish-revision-gamevals.yml"
  workflow_dispatch:
    inputs:
      new_revision:
        description: "Manually set a new revision (e.g., 236.2)"
        required: false
        type: string

jobs:
  update-files:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.determine_rev.outputs.revision }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine revision
        id: determine_rev
        env:
          REQUESTED_REVISION: ${{ inputs.new_revision }}
        run: |
          REVISION="${REQUESTED_REVISION:-$(awk '/^revision:/ { print $2; exit }' game.example.yml)}"
          [[ "$REVISION" =~ ^[0-9]+([.][0-9]+)?$ ]] || {
            echo "::error::Expected a numeric revision such as 242 or 242.2."
            exit 1
          }
          if [[ -n "$REQUESTED_REVISION" ]]; then
            sed -i -E "s/^revision: .*/revision: ${REVISION}/" game.example.yml
          fi

          echo "revision=$REVISION" >> $GITHUB_OUTPUT

          # Extract integer part for jav_config_url
          REV_INT=$(echo "$REVISION" | cut -d'.' -f1)
          echo "revision_int=$REV_INT" >> $GITHUB_OUTPUT

      - name: Update README.md
        id: update_readme
        run: |
          REV=${{ steps.determine_rev.outputs.revision }}
          REV_INT=${{ steps.determine_rev.outputs.revision_int }}

          cp README.md README.md.bak

          # Update inline markdown badge text
          sed -i -E "s/\[!\[revision: [0-9.]+\]\[rev-badge\]\]/[![revision: ${REV}][rev-badge]]/g" README.md

          # Update markdown badge URL
          sed -i -E "s|(\[rev-badge\]: https://img\.shields\.io/badge/Revision-)[0-9.]+(-blueviolet)|\1${REV}\2|g" README.md

          # --- NEW: Update HTML badge alt text ---
          sed -i -E 's|(alt="Revision )[0-9.]+(")|\1'"${REV}"'\2|g' README.md

          # --- NEW: Update HTML badge image URL ---
          sed -i -E 's|(img\.shields\.io/badge/Revision-)[0-9.]+(-blueviolet)|\1'"${REV}"'\2|g' README.md

          # Update jav_config_url integer part only
          sed -i -E "s|(jav_config_url: https://client\.blurite\.io/jav_local_)[0-9]+(\.ws)|\1${REV_INT}\2|g" README.md

          # Update all revision: lines (indented or not)
          sed -i -E "s|([[:space:]]*revision: )[0-9.]+|\1${REV}|" README.md

          if diff -q README.md README.md.bak > /dev/null; then
            echo "README.md already up-to-date."
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "README.md updated."
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.update_readme.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          if git diff --quiet -- README.md game.example.yml; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md game.example.yml
          git commit -m "Sync revision to ${{ steps.determine_rev.outputs.revision }}"
          git push

  publish-gamevals:
    needs: update-files
    uses: ./.github/workflows/publish-revision-gamevals.yml
    with:
      revision: ${{ needs.update-files.outputs.revision }}
